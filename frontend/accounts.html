<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>选择身份 - Demo SSO</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body class="auth-page">
  <header class="auth-header">
    <a class="brand" href="index.html" aria-label="返回 Demo SSO 首页">
      <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3 5 6v5c0 4.8 2.9 8.2 7 10 4.1-1.8 7-5.2 7-10V6l-7-3Z"/><path d="m9.5 12 1.7 1.7 3.5-3.7"/></svg>
      <span>Demo SSO</span>
    </a>
  </header>

  <main class="auth-main auth-main-wide">
    <section aria-labelledby="accounts-title">
      <div class="auth-heading auth-heading-centered">
        <div class="brand-mark brand-mark-large" aria-hidden="true">
          <svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3.5 19c.4-4 2.3-6 5.5-6s5.1 2 5.5 6M16 7.5a3 3 0 0 1 0 5.8M16.5 14c2.4.4 3.7 2.2 4 4.5"/></svg>
        </div>
        <div>
          <h1 id="accounts-title">选择要登录的身份</h1>
          <p>模拟同一浏览器中已保存的多个账号。</p>
        </div>
      </div>

      <div id="identity-list" class="identity-list"></div>

      <div class="center-action">
        <a class="button button-secondary" href="login.html">使用另一个账号</a>
      </div>
    </section>
  </main>

  <footer class="auth-footer">
    <a class="text-link" href="index.html">返回首页</a>
  </footer>

  <script src="assets/auth.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
