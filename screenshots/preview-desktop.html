<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>预览 · 桌面视口 1440px</title>
<style>
  :root{
    --c-primary:#2F5D62;
    --c-bg:#E7EBEB;
    --c-surface:#FFFFFF;
    --c-text:#1B2223;
    --c-muted:#5F6B6D;
    --space-4:16px;
    --space-5:24px;
    --radius-sm:8px;
    --fs-sm:13px;
    --font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--c-bg);color:var(--c-text);font-family:var(--font-sans);}
  .bar{
    position:sticky;top:0;z-index:10;
    background:var(--c-primary);color:#fff;
    padding:12px var(--space-5);
    display:flex;align-items:center;justify-content:space-between;gap:var(--space-4);flex-wrap:wrap;
    font-size:var(--fs-sm);font-weight:600;
  }
  .bar em{font-style:normal;font-weight:400;opacity:.8;}
  .stage{padding:var(--space-5);display:flex;justify-content:center;}
  .frame{
    width:1440px;max-width:100%;
    background:var(--c-surface);
    border:1px solid #D5DCDC;
    border-radius:var(--radius-sm);
    overflow:hidden;
    box-shadow:0 1px 2px rgba(27,34,35,.05),0 12px 32px rgba(27,34,35,.10);
  }
  .frame iframe{display:block;width:1440px;height:2200px;border:0;transform-origin:top left;}
  .note{max-width:760px;margin:0 auto var(--space-5);padding:0 var(--space-5);color:var(--c-muted);font-size:var(--fs-sm);line-height:1.7;}
</style>
</head>
<body>
  <div class="bar">
    <span>桌面视口 1440px · 预览渲染</span>
    <em>真实 PNG 截图请执行： node scripts/capture.mjs</em>
  </div>
  <p class="note">下方为 test-screenshot.html 在 1440px 宽度下的实时渲染结果（iframe 内为真实页面源文件）。该预览用于快速核对布局；位图截图请运行 npm run capture 产出 screenshots/screenshot-desktop.png 与 screenshots/screenshot-mobile.png。</p>
  <div class="stage">
    <div class="frame">
      <iframe src="../test-screenshot.html" title="桌面视口预览" scrolling="no"></iframe>
    </div>
  </div>
</body>
</html>
