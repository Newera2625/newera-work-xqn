  <text x="192.5" y="478" font-size="11" fill="#B4531A" text-anchor="middle" font-weight="700">Q</text>
  <text x="212" y="479" font-size="13" fill="#0E0C0A" font-family="ui-monospace, Menlo, monospace" font-weight="600">3627236036</text>
