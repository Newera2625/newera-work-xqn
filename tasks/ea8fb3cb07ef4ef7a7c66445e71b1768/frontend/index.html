<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>登录 - NewEra Copilot</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="brand-panel" aria-label="产品介绍">
      <div class="brand-content">
        <a class="brand" href="index.html" aria-label="NewEra Copilot 首页">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32" fill="none">
              <path d="M8 23V9h5.2l5.6 8.2V9H24v14h-5.1l-5.7-8.3V23H8Z" fill="currentColor"/>
            </svg>
          </span>
          <span>NewEra Copilot</span>
        </a>
        <div class="brand-copy">
          <p class="eyebrow">企业智能协作平台</p>
          <h1>一个身份，安全访问<br>所有工作空间</h1>
          <p>统一管理团队账号与访问权限，让每一次协作都简单、可靠。</p>
        </div>
        <ul class="feature-list">
          <li>
            <span class="feature-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M12 3 4.5 6v5.5c0 4.5 3 8.1 7.5 9.5 4.5-1.4 7.5-5 7.5-9.5V6L12 3Z"/><path d="m9 12 2 2 4-4"/></svg>
            </span>
            <span><strong>统一身份</strong><small>一次登录，安全访问全部服务</small></span>
          </li>
          <li>
            <span class="feature-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
            </span>
            <span><strong>权限可控</strong><small>清晰的角色与访问边界</small></span>
          </li>
          <li>
            <span class="feature-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
            </span>
            <span><strong>持续在线</strong><small>稳定的会话与跨设备体验</small></span>
          </li>
        </ul>
      </div>
      <div class="brand-decoration" aria-hidden="true"></div>
    </section>

    <section class="form-panel">
      <div class="mobile-brand" aria-label="NewEra Copilot">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" fill="none"><path d="M8 23V9h5.2l5.6 8.2V9H24v14h-5.1l-5.7-8.3V23H8Z" fill="currentColor"/></svg>
        </span>
        <span>NewEra Copilot</span>
      </div>

      <div class="login-card">
        <div class="notice" id="topNotice" role="status" aria-live="polite" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>
          <span id="topNoticeText"></span>
          <button type="button" class="notice-close" id="noticeClose" aria-label="关闭提示">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17"/></svg>
          </button>
        </div>

        <header class="card-header">
          <h2>登录</h2>
          <p>使用企业统一身份继续</p>
        </header>

        <div class="tabs" role="tablist" aria-label="登录方式">
          <span class="tab-indicator" id="tabIndicator" aria-hidden="true"></span>
          <button id="passwordTab" class="tab is-active" role="tab" aria-selected="true" aria-controls="passwordPanel" type="button">账号密码</button>
          <button id="smsTab" class="tab" role="tab" aria-selected="false" aria-controls="smsPanel" type="button">短信验证码</button>
          <button id="qrTab" class="tab" role="tab" aria-selected="false" aria-controls="qrPanel" type="button">扫码登录</button>
        </div>

        <div id="passwordPanel" class="auth-panel" role="tabpanel" aria-labelledby="passwordTab">
          <form id="passwordForm" novalidate>
            <div class="field">
              <label for="account">账号</label>
              <div class="input-shell">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M5 20a7 7 0 0 1 14 0"/></svg>
                <input id="account" name="account" type="text" autocomplete="username" placeholder="请输入邮箱或用户名" aria-describedby="accountError">
              </div>
              <p class="field-error" id="accountError" aria-live="polite"></p>
            </div>

            <div class="field">
              <label for="password">密码</label>
              <div class="input-shell">
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
                <input id="password" name="password" type="password" autocomplete="current-password" placeholder="请输入密码" aria-describedby="passwordError">
                <button class="input-action" id="togglePassword" type="button" aria-label="显示密码" aria-pressed="false">
                  <svg class="eye-open" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12s3.5-6 9-6 9 6 9 6-3.5 6-9 6-9-6-9-6Z"/><circle cx="12" cy="12" r="2.5"/></svg>
                  <svg class="eye-closed" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="m4 4 16 16M10.6 6.1A8 8 0 0 1 12 6c5.5 0 9 6 9 6a13 13 0 0 1-2.1 2.7M6.2 6.2C4 8 3 12 3 12s3.5 6 9 6c1 0 2-.2 2.8-.5"/></svg>
                </button>
              </div>
              <p class="field-error" id="passwordError" aria-live="polite"></p>
            </div>

            <div class="form-row">
              <label class="checkbox-label">
                <input id="rememberAccount" type="checkbox">
                <span class="checkbox" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="m3 8 3 3 7-7"/></svg></span>
                <span>记住账号</span>
              </label>
              <button type="button" class="text-button" id="forgotPassword">忘记密码？</button>
            </div>

            <button class="primary-button" id="passwordSubmit" type="submit">
              <span class="button-label">登录</span>
              <span class="spinner" aria-hidden="true"></span>
            </button>
          </form>
        </div>

        <div id="smsPanel" class="auth-panel" role="tabpanel" aria-labelledby="smsTab" hidden>
          <form id="smsForm" novalidate>
            <div class="field">
              <label for="phone">手机号</label>
              <div class="input-shell">
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="3" width="10" height="18" rx="2"/><path d="M10 6h4M11 18h2"/></svg>
                <input id="phone" name="phone" type="tel" inputmode="numeric" autocomplete="tel" maxlength="11" placeholder="请输入 11 位手机号" aria-describedby="phoneError">
              </div>
              <p class="field-error" id="phoneError" aria-live="polite"></p>
            </div>

            <div class="field">
              <label for="smsCode">短信验证码</label>
              <div class="input-shell code-shell">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h14v14H5z"/><path d="M8 9h8M8 12h5M8 15h3"/></svg>
                <input id="smsCode" name="smsCode" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="请输入 6 位验证码" aria-describedby="smsCodeError">
                <button id="sendCode" class="code-button" type="button">获取验证码</button>
              </div>
              <p class="field-error" id="smsCodeError" aria-live="polite"></p>
            </div>

            <button class="primary-button" id="smsSubmit" type="submit">
              <span class="button-label">登录</span>
              <span class="spinner" aria-hidden="true"></span>
            </button>
          </form>
        </div>

        <div id="qrPanel" class="auth-panel qr-panel" role="tabpanel" aria-labelledby="qrTab" hidden>
          <div class="qr-code" id="qrCode" aria-label="模拟登录二维码">
            <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
            <div class="qr-center" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M12 3 4.5 6v5.5c0 4.5 3 8.1 7.5 9.5 4.5-1.4 7.5-5 7.5-9.5V6L12 3Z"/><path d="m9 12 2 2 4-4"/></svg>
            </div>
          </div>
          <div class="qr-status" id="qrStatus" aria-live="polite">
            <span class="status-dot" aria-hidden="true"></span>
            <strong id="qrStatusTitle">请使用企业微信扫码</strong>
            <p id="qrStatusText">扫码后将在手机上确认登录</p>
          </div>
          <button class="primary-button" id="qrSubmit" type="button" disabled>
            <span class="button-label">等待扫码</span>
            <span class="spinner" aria-hidden="true"></span>
          </button>
          <div class="qr-actions">
            <button type="button" class="text-button" id="refreshQr">刷新二维码</button>
            <span aria-hidden="true"></span>
            <button type="button" class="text-button" id="switchAccount">切换账号</button>
          </div>
        </div>

        <div class="divider"><span>其他登录方式</span></div>
        <div class="social-buttons" aria-label="第三方登录">
          <button type="button" aria-label="使用企业微信登录">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 8.5c1.2 0 2.2 1 2.2 2.2s-1 2.2-2.2 2.2H8.7c-1.2 0-2.2-1-2.2-2.2S7.5 8.5 8.7 8.5h5.8Z"/><path d="M5.7 8.5c0-1.2 1-2.2 2.2-2.2h5.8c1.2 0 2.2 1 2.2 2.2v1.1H8.8a3.1 3.1 0 0 0-3.1 3.1v1.3H5.7v-5.5Z"/><path d="M18.3 14.5c0 1.2-1 2.2-2.2 2.2h-5.8c-1.2 0-2.2-1-2.2-2.2v-1.1h5.8a3.1 3.1 0 0 0 3.1-3.1v-1.3h1.3v5.5Z"/></svg>
          </button>
          <button type="button" aria-label="使用企业邮箱登录">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></svg>
          </button>
          <button type="button" aria-label="使用组织账号登录">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V8l8-5 8 5v12M8 20v-6h8v6M9 9h.01M12 9h.01M15 9h.01"/></svg>
          </button>
        </div>

        <div class="agreement">
          <label class="checkbox-label">
            <input id="agreement" type="checkbox">
            <span class="checkbox" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="m3 8 3 3 7-7"/></svg></span>
            <span>我已阅读并同意 <a href="#terms">《服务条款》</a><a href="#privacy">《隐私政策》</a></span>
          </label>
          <p class="field-error agreement-error" id="agreementError" aria-live="polite"></p>
        </div>
      </div>
      <p class="copyright">© 2026 NewEra Copilot. 安全连接企业数字工作空间。</p>
    </section>
  </main>

  <div class="modal-backdrop" id="sessionModal" role="presentation" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="sessionTitle" aria-describedby="sessionDescription">
      <span class="modal-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      </span>
      <h2 id="sessionTitle">会话已过期</h2>
      <p id="sessionDescription">为保障账号安全，您的登录状态已失效。请重新登录以继续访问。</p>
      <button type="button" class="primary-button" id="reloginButton">重新登录</button>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
