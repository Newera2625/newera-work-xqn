<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>统一身份认证 - 短信验证码登录</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="login-shell login-shell--single">
    <section class="form-panel">
      <div class="login-card">
        <header class="card-heading">
          <h2>短信验证码登录</h2>
          <p>验证码将发送至您的企业预留手机号</p>
        </header>

        <div class="card-notice-stack" aria-live="polite">
          <div class="card-notice card-notice--info" role="status">
            <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7"/><path d="M10 9v5M10 6.5v.5"/></svg>
            <span>首次使用短信登录需先完成账号绑定</span>
          </div>
        </div>

        <div class="login-tabs" role="tablist" aria-label="登录方式">
          <button class="tab" role="tab" aria-selected="false">账号密码</button>
          <button class="tab is-active" role="tab" aria-selected="true">短信验证码</button>
          <button class="tab" role="tab" aria-selected="false">扫码登录</button>
          <span class="tab-indicator" aria-hidden="true" style="transform: translateX(100%);"></span>
        </div>

        <form class="login-form" novalidate>
          <div class="field-group">
            <label for="phone">手机号</label>
            <div class="input-shell">
              <svg class="input-icon" viewBox="0 0 20 20" aria-hidden="true"><rect x="5" y="2.5" width="10" height="15" rx="2"/><path d="M8 5h4M9 14.5h2"/></svg>
              <input id="phone" name="phone" type="tel" inputmode="numeric" autocomplete="tel" maxlength="11" placeholder="请输入手机号">
            </div>
            <p class="field-error" data-error-for="phone"></p>
          </div>

          <div class="field-group">
            <label for="sms-code">验证码</label>
            <div class="code-input-row">
              <div class="input-shell">
                <svg class="input-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M5 3.5h10v13H5z"/><path d="M7.5 7h5M7.5 10h5M7.5 13h3"/></svg>
                <input id="sms-code" name="sms-code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="请输入6位验证码">
              </div>
              <button class="code-button" type="button" data-action="send-code">获取验证码</button>
            </div>
            <p class="field-error" data-error-for="sms-code"></p>
          </div>

          <div class="form-options">
            <label class="checkbox-label">
              <input type="checkbox" checked>
              <span class="checkbox" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="m3 8 3 3 7-7"/></svg></span>
              <span>在此设备保持登录</span>
            </label>
            <a class="meta-link" href="#">登录遇到问题</a>
          </div>

          <button class="primary-button primary-button--wide" type="submit">登录</button>
        </form>

        <div class="login-meta login-meta--center">
          <span>登录即表示您同意</span>
          <a class="meta-link" href="#">服务条款</a>
          <span>与</span>
          <a class="meta-link" href="#">隐私政策</a>
        </div>
      </div>
    </section>
  </main>

  <script>
    const form = document.querySelector('.login-form');
    const phoneInput = document.querySelector('#phone');
    const codeInput = document.querySelector('#sms-code');
    const sendCodeButton = document.querySelector('[data-action="send-code"]');
    let countdownTimer;

    function setFieldError(name, message) {
      const field = document.querySelector(`[data-error-for="${name}"]`);
      const input = document.querySelector(`[name="${name}"]`);
      field.textContent = message;
      field.classList.toggle('is-visible', Boolean(message));
      input.setAttribute('aria-invalid', message ? 'true' : 'false');
    }

    function isValidPhone(value) {
      return /^1\d{10}$/.test(value);
    }

    sendCodeButton.addEventListener('click', () => {
      if (!isValidPhone(phoneInput.value.trim())) {
        setFieldError('phone', '请输入正确的11位手机号');
        phoneInput.focus();
        return;
      }

      setFieldError('phone', '');
      let remaining = 60;
      sendCodeButton.disabled = true;
      sendCodeButton.textContent = `${remaining}s 后重新获取`;

      countdownTimer = window.setInterval(() => {
        remaining -= 1;
        if (remaining <= 0) {
          window.clearInterval(countdownTimer);
          sendCodeButton.disabled = false;
          sendCodeButton.textContent = '重新获取验证码';
          return;
        }
        sendCodeButton.textContent = `${remaining}s 后重新获取`;
      }, 1000);
    });

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      let hasError = false;

      if (!isValidPhone(phoneInput.value.trim())) {
        setFieldError('phone', '请输入正确的11位手机号');
        hasError = true;
      } else {
        setFieldError('phone', '');
      }

      if (!/^\d{6}$/.test(codeInput.value.trim())) {
        setFieldError('sms-code', '请输入6位验证码');
        hasError = true;
      } else {
        setFieldError('sms-code', '');
      }

      if (hasError) {
        return;
      }

      const submitButton = form.querySelector('button[type="submit"]');
      submitButton.disabled = true;
      submitButton.textContent = '正在登录';

      window.setTimeout(() => {
        submitButton.disabled = false;
        submitButton.textContent = '登录';
      }, 1000);
    });
  </script>
</body>
</html>
