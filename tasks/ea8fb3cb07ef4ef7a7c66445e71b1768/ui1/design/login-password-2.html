<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>统一身份认证 - 账号密码登录</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="login-shell login-shell--single">
    <section class="form-panel">
      <div class="login-card">
        <header class="card-heading">
          <h2>账号密码登录</h2>
          <p>使用企业统一身份继续</p>
        </header>

        <div class="card-notice-stack" aria-live="polite">
          <div class="card-notice card-notice--error" role="alert" hidden>
            <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7"/><path d="M10 9v5M10 6.5v.5"/></svg>
            <span>账号或密码错误，请重新输入</span>
          </div>
        </div>

        <div class="login-tabs" role="tablist" aria-label="登录方式">
          <button class="tab is-active" role="tab" aria-selected="true">账号密码</button>
          <button class="tab" role="tab" aria-selected="false">短信验证码</button>
          <button class="tab" role="tab" aria-selected="false">扫码登录</button>
          <span class="tab-indicator" aria-hidden="true"></span>
        </div>

        <form class="login-form" novalidate>
          <div class="field-group">
            <label for="username">账号</label>
            <div class="input-shell">
              <svg class="input-icon" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="7" r="3"/><path d="M4.5 16c.6-3 2.4-4.5 5.5-4.5s4.9 1.5 5.5 4.5"/></svg>
              <input id="username" name="username" type="text" autocomplete="username" placeholder="请输入账号">
            </div>
            <p class="field-error" data-error-for="username"></p>
          </div>

          <div class="field-group">
            <label for="password">密码</label>
            <div class="input-shell">
              <svg class="input-icon" viewBox="0 0 20 20" aria-hidden="true"><rect x="4" y="8" width="12" height="9" rx="2"/><path d="M7 8V6a3 3 0 0 1 6 0v2"/></svg>
              <input id="password" name="password" type="password" autocomplete="current-password" placeholder="请输入密码">
              <button class="password-toggle" type="button" aria-label="显示密码" aria-pressed="false">
                <svg class="eye-icon eye-icon--show" viewBox="0 0 20 20" aria-hidden="true"><path d="M2.5 10s2.7-4.5 7.5-4.5 7.5 4.5 7.5 4.5-2.7 4.5-7.5 4.5S2.5 10 2.5 10Z"/><circle cx="10" cy="10" r="2"/></svg>
                <svg class="eye-icon eye-icon--hide" viewBox="0 0 20 20" aria-hidden="true"><path d="m3 3 14 14M8.3 5.8A8 8 0 0 1 10 5.5c4.8 0 7.5 4.5 7.5 4.5a11.5 11.5 0 0 1-2.1 2.6M12.2 13.8c-.7.4-1.4.7-2.2.7-4.8 0-7.5-4.5-7.5-4.5a11.7 11.7 0 0 1 2.1-2.6"/></svg>
              </button>
            </div>
            <p class="field-error" data-error-for="password"></p>
          </div>

          <div class="form-options">
            <label class="checkbox-label">
              <input type="checkbox">
              <span class="checkbox" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="m3 8 3 3 7-7"/></svg></span>
              <span>记住账号</span>
            </label>
            <a class="meta-link" href="#">忘记密码</a>
          </div>

          <button class="primary-button primary-button--wide" type="submit">登录</button>
        </form>

        <div class="login-meta login-meta--center">
          <span>登录即表示您同意</span>
          <a class="meta-link" href="#">服务条款</a>
          <span>与</span>
          <a class="meta-link" href="#">隐私政策</a>
        </div>
      </div>
    </section>
  </main>

  <script>
    const form = document.querySelector('.login-form');
    const usernameInput = document.querySelector('#username');
    const passwordInput = document.querySelector('#password');
    const passwordToggle = document.querySelector('.password-toggle');
    const errorNotice = document.querySelector('.card-notice--error');

    function setFieldError(name, message) {
      const field = document.querySelector(`[data-error-for="${name}"]`);
      const input = document.querySelector(`[name="${name}"]`);
      field.textContent = message;
      field.classList.toggle('is-visible', Boolean(message));
      input.setAttribute('aria-invalid', message ? 'true' : 'false');
    }

    passwordToggle.addEventListener('click', () => {
      const isVisible = passwordInput.type === 'text';
      passwordInput.type = isVisible ? 'password' : 'text';
      passwordToggle.setAttribute('aria-pressed', String(!isVisible));
      passwordToggle.setAttribute('aria-label', isVisible ? '显示密码' : '隐藏密码');
    });

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      let hasError = false;

      if (!usernameInput.value.trim()) {
        setFieldError('username', '请输入账号');
        hasError = true;
      } else {
        setFieldError('username', '');
      }

      if (!passwordInput.value) {
        setFieldError('password', '请输入密码');
        hasError = true;
      } else {
        setFieldError('password', '');
      }

      errorNotice.hidden = true;

      if (hasError) {
        return;
      }

      const submitButton = form.querySelector('button[type="submit"]');
      submitButton.disabled = true;
      submitButton.textContent = '正在登录';

      window.setTimeout(() => {
        errorNotice.hidden = false;
        submitButton.disabled = false;
        submitButton.textContent = '登录';
      }, 1000);
    });
  </script>
</body>
</html>
