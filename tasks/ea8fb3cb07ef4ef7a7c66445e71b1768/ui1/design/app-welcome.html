<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>企业统一身份认证 - 工作台</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="app-page">
  <!-- 本文件仅为设计稿，交互逻辑由前端在正式页面实现。 -->
  <header class="app-header">
    <a class="app-brand" href="#">
      <span class="brand-mark brand-mark--small" aria-hidden="true"><svg viewBox="0 0 64 64"><path d="M32 5 53 14v15c0 14-8.8 24.7-21 30C19.8 53.7 11 43 11 29V14l21-9Z"/><path d="m22 31 7 7 14-16"/></svg></span>
      <span>企业服务门户</span>
    </a>
    <div class="user-menu-wrap">
      <button class="user-trigger" type="button" aria-expanded="true">
        <span class="avatar" aria-hidden="true"><svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="18"/><circle cx="18" cy="14" r="5"/><path d="M8.5 29c1.3-5.4 4.7-8 9.5-8s8.2 2.6 9.5 8"/></svg></span>
        <span>张明</span>
        <svg class="chevron" viewBox="0 0 20 20" aria-hidden="true"><path d="m6 8 4 4 4-4"/></svg>
      </button>
      <div class="user-menu" role="menu">
        <div class="user-menu__meta"><strong>张明</strong><span>zhangming@example.com</span></div>
        <div class="user-menu__divider"></div>
        <button role="menuitem"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="7" r="3"/><path d="M4 17c.6-3.2 2.7-5 6-5s5.4 1.8 6 5"/></svg>个人资料</button>
        <button role="menuitem"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7"/><path d="M10 6v4l3 2"/></svg>登录记录</button>
        <button class="danger-menu-item" role="menuitem"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M8 3H4v14h4M11 6l4 4-4 4M15 10H6"/></svg>退出登录</button>
      </div>
    </div>
  </header>

  <main class="app-main">
    <section class="welcome-card">
      <div>
        <p class="eyebrow">工作台</p>
        <h1>上午好，张明</h1>
        <p>欢迎回到企业服务门户，你可以从下方功能快速开始处理业务。</p>
      </div>
      <div class="welcome-actions">
        <button class="button button--primary">创建申请</button>
        <button class="button button--secondary">查看指南</button>
      </div>
    </section>

    <section class="feature-section">
      <div class="section-heading section-heading--inline"><div><h2>常用功能</h2><p>快速进入高频企业服务</p></div><a class="text-link" href="#">查看全部</a></div>
      <div class="feature-cards">
        <article class="feature-card">
          <span class="feature-card__icon"><svg viewBox="0 0 32 32" aria-hidden="true"><rect x="4" y="6" width="24" height="20" rx="3"/><path d="M9 12h14M9 17h9M9 22h6"/></svg></span>
          <h3>待办审批</h3><p>集中查看需要你处理的审批事项。</p><a class="text-link" href="#">进入</a>
        </article>
        <article class="feature-card">
          <span class="feature-card__icon"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M7 26V10l9-5 9 5v16"/><path d="M12 26v-9h8v9M7 16h18"/></svg></span>
          <h3>应用中心</h3><p>访问已获得授权的企业应用。</p><a class="text-link" href="#">进入</a>
        </article>
        <article class="feature-card">
          <span class="feature-card__icon"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="12"/><path d="M16 10v7l5 3"/></svg></span>
          <h3>服务记录</h3><p>查询申请与安全登录记录。</p><a class="text-link" href="#">进入</a>
        </article>
      </div>
    </section>
  </main>
</body>
</html>
