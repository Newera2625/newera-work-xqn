<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - Demo SSO</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body class="auth-page">
  <header class="auth-header">
    <a class="brand" href="index.html" aria-label="返回 Demo SSO 首页">
      <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3 5 6v5c0 4.8 2.9 8.2 7 10 4.1-1.8 7-5.2 7-10V6l-7-3Z"/><path d="m9.5 12 1.7 1.7 3.5-3.7"/></svg>
      <span>Demo SSO</span>
    </a>
  </header>

  <main class="auth-main">
    <section class="auth-card" aria-labelledby="login-title">
      <div class="auth-heading">
        <div class="brand-mark brand-mark-large" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 3 5 6v5c0 4.8 2.9 8.2 7 10 4.1-1.8 7-5.2 7-10V6l-7-3Z"/><path d="m9.5 12 1.7 1.7 3.5-3.7"/></svg>
        </div>
        <div>
          <h1 id="login-title">登录 Demo SSO</h1>
          <p>使用演示账号继续访问受保护应用。</p>
        </div>
      </div>

      <div id="status-banner" class="notice notice-info" role="status" aria-live="polite" hidden></div>
      <div id="error-banner" class="notice notice-error" role="alert" aria-live="polite" hidden>
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 8v5M12 17h.01"/><circle cx="12" cy="12" r="9"/></svg>
        <span id="error-message">账号或密码不正确，请重试。</span>
      </div>

      <form id="login-form" novalidate>
        <div class="field-group">
          <label for="email">邮箱</label>
          <div class="input-wrap">
            <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></svg>
            <input id="email" name="email" type="email" placeholder="you@demo.com" autocomplete="username" required aria-describedby="email-error">
          </div>
          <p id="email-error" class="field-error" aria-live="polite"></p>
        </div>

        <div class="field-group">
          <label for="password">密码</label>
          <div class="input-wrap">
            <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
            <input id="password" name="password" type="password" placeholder="请输入密码" autocomplete="current-password" required aria-describedby="password-error">
            <button id="toggle-password" class="icon-button input-action" type="button" aria-label="显示密码" aria-pressed="false">
              <svg class="eye-open" aria-hidden="true" viewBox="0 0 24 24"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.5"/></svg>
              <svg class="eye-closed" aria-hidden="true" viewBox="0 0 24 24" hidden><path d="m4 4 16 16M10.6 6.2A10 10 0 0 1 12 6c6 0 9.5 6 9.5 6a16 16 0 0 1-2.1 2.8M6.2 6.2C3.8 8 2.5 12 2.5 12s3.5 6 9.5 6a9 9 0 0 0 3-.5M10 10a2.8 2.8 0 0 0 4 4"/></svg>
            </button>
          </div>
          <p id="password-error" class="field-error" aria-live="polite"></p>
        </div>

        <label class="checkbox">
          <input id="remember" type="checkbox">
          <span class="checkbox-control" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="m3.5 8 3 3 6-6"/></svg></span>
          <span>记住此设备（30 天）</span>
        </label>

        <button id="login-button" class="button button-primary button-full" type="submit">
          <span class="button-label">登录</span>
          <span class="button-spinner" aria-hidden="true"></span>
        </button>
      </form>

      <div class="divider"><span>或使用已有身份登录</span></div>
      <a class="button button-secondary button-full" href="accounts.html">选择已有身份</a>

      <div class="demo-hint">
        <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7h.01"/></svg>
        <p>演示账号：admin@demo.com、user@demo.com、guest@demo.com，密码均为 <code>demo123</code>。</p>
      </div>
    </section>
  </main>

  <footer class="auth-footer">
    <a class="text-link" href="index.html">返回首页</a>
  </footer>

  <script src="assets/auth.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
