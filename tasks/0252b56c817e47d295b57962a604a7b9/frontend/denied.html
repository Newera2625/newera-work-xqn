<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>需要登录 - Demo SSO</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body class="auth-page">
  <header class="auth-header">
    <a class="brand" href="index.html" aria-label="返回 Demo SSO 首页">
      <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3 5 6v5c0 4.8 2.9 8.2 7 10 4.1-1.8 7-5.2 7-10V6l-7-3Z"/><path d="m9.5 12 1.7 1.7 3.5-3.7"/></svg>
      <span>Demo SSO</span>
    </a>
  </header>

  <main class="auth-main">
    <section class="auth-card denied-card" aria-labelledby="denied-title">
      <div class="denied-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M7 10V8a5 5 0 0 1 10 0v2"/><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M12 14v3"/></svg>
      </div>
      <p class="eyebrow">访问受限</p>
      <h1 id="denied-title">需要登录后才能访问</h1>
      <p>该资源受统一身份认证保护。请先登录，认证成功后将自动返回原访问地址。</p>
      <div class="stack-actions">
        <a id="denied-login" class="button button-primary button-full" href="login.html?redirect=app.html">前往登录</a>
        <a class="button button-secondary button-full" href="index.html">返回首页</a>
      </div>
    </section>
  </main>

  <footer class="auth-footer">
    <a class="text-link" href="index.html">返回 Demo SSO 首页</a>
  </footer>

  <script src="assets/auth.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
