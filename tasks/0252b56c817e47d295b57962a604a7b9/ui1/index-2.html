<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="登录 Demo SSO 统一认证中心。">
  <title>登录 - Demo SSO</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <main class="auth-page">
    <div class="auth-layout">
      <div class="auth-brand">
        <a class="brand" href="index.html" aria-label="返回 Demo SSO 首页">
          <span class="brand__mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <path d="M7 10V8a5 5 0 0 1 10 0v2m-9 0h8a2 2 0 0 1 2 2v7H6v-7a2 2 0 0 1 2-2Z" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M12 14v2" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/>
            </svg>
          </span>
          <span>Demo SSO</span>
        </a>
      </div>

      <section class="card auth-card" aria-labelledby="login-heading">
        <div class="auth-heading">
          <h1 id="login-heading">登录 Demo SSO</h1>
          <p>使用演示账号继续</p>
        </div>

        <div data-login-notices></div>

        <div class="notice" data-login-error hidden role="alert" aria-live="polite">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 9v4m0 4h.01M10.3 3.9 2.7 17a2 2 0 0 0 1.7 3h15.2a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span data-login-error-text></span>
        </div>

        <form class="form" data-login-form novalidate>
          <div class="form-field">
            <label class="form-label" for="email">邮箱</label>
            <div class="input-wrap">
              <span class="input-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none">
                  <rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="1.75"/>
                  <path d="m4 7 8 6 8-6" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </span>
              <input
                class="input input--with-icon"
                id="email"
                name="email"
                type="email"
                inputmode="email"
                autocomplete="username"
                placeholder="you@demo.com"
                aria-describedby="email-hint"
                required
