<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>选择身份 · Demo SSO</title>
<meta name="description" content="Demo SSO 身份选择页：模拟同一浏览器中已保存的多个账号。">
<link rel="stylesheet" href="assets/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%233B5BDB' stroke-width='1.75' stroke-linecap='round' stroke-linejoin='round'%3E%3Ccircle cx='7.5' cy='12' r='3.5'/%3E%3Ccircle cx='16.5' cy='12' r='3.5'/%3E%3Cpath d='M11 12h2'/%3E%3C/svg%3E">
</head>
<body>

<header class="site-nav">
  <div class="container site-nav__inner">
    <a class="brand" href="index.html">
      <svg class="brand__mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <circle cx="7.5" cy="12" r="3.5"></circle>
        <circle cx="16.5" cy="12" r="3.5"></circle>
        <path d="M11 12h2"></path>
      </svg>
      <span class="brand__name">Demo SSO</span>
    </a>
    <nav class="nav-actions" aria-label="主导航">
      <a class="nav-link" href="index.html">首页</a>
      <a class="btn btn--ghost btn--sm" href="login.html">登录</a>
    </nav>
  </div>
</header>

<main class="container page">
  <div class="page__head">
    <h1 class="page__title">选择要登录的身份</h1>
    <p class="page__desc">模拟同一浏览器中已保存的多个账号，点击任意一项即可完成登录。</p>
  </div>

  <ul class="account-list" data-el="account-list">
    <li>
      <a class="account-card" data-el="account-card" href="#" role="button" data-email="admin@demo.com" data-role="admin">
        <span class="avatar" aria-hidden="true">A</span>
        <span class="account-card__body">
          <span class="account-card__name">admin@demo.com</span>
          <span class="account-card__meta">
            <span class="badge badge--neutral">管理员</span>
            <span class="account-card__desc">拥有全部演示应用访问权限</span>
          </span>
        </span>
        <span class="account-card__cta">
          <span>继续</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <path d="M5 12h14M13 6l6 6-6 6"></path>
          </svg>
        </span>
      </a>
    </li>

    <li>
      <a class="account-card" data-el="account-card" href="#" role="button" data-email="user@demo.com" data-role="member">
        <span class="avatar" aria-hidden="true">U</span>
        <span class="account-card__body">
          <span class="account-card__name">user@demo.com</span>
          <span class="account-card__meta">
            <span class="badge badge--neutral">成员</span>
            <span class="account-card__desc">普通成员，可访问工单系统与报表中心</span>
          </span>
        </span>
        <span class="account-card__cta">
          <span>继续</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <path d="M5 12h14M13 6l6 6-6 6"></path>
          </svg>
        </span>
      </a>
    </li>

    <li>
      <a class="account-card" data-el="account-card" href="#" role="button" data-email="guest@demo.com" data-role="guest">
        <span class="avatar" aria-hidden="true">G</span>
        <span class="account-card__body">
          <span class="account-card__name">guest@demo.com</span>
          <span class="account-card__meta">
            <span class="badge badge--neutral">访客</span>
            <span class="account-card__desc">只读访客，用于观察权限差异</span>
          </span>
        </span>
        <span class="account-card__cta">
          <span>继续</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <path d="M5 12h14M13 6l6 6-6 6"></path>
          </svg>
        </span>
      </a>
    </li>
  </ul>

  <div class="page__foot">
    <button class="btn btn--ghost btn--md" type="button" data-el="use-another-account">
      <span class="btn__label">使用另一个账号</span>
    </button>
  </div>
</main>

<footer class="site-footer">
  <div class="container site-footer__inner">
    <span>Demo SSO · 单点登录演示项目</span>
    <span>本项目仅用于前端演示，会话数据保存在浏览器 localStorage 中。</span>
  </div>
</footer>

<script src="assets/auth.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
