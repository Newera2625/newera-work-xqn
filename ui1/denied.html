<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>需要登录 · Demo SSO</title>
<meta name="description" content="该页面受 SSO 会话保护，请先完成登录。">
<link rel="stylesheet" href="assets/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%233B5BDB' stroke-width='1.75' stroke-linecap='round' stroke-linejoin='round'%3E%3Ccircle cx='7.5' cy='12' r='3.5'/%3E%3Ccircle cx='16.5' cy='12' r='3.5'/%3E%3Cpath d='M11 12h2'/%3E%3C/svg%3E">
</head>
<body>

<main class="auth-main">
  <section class="card card--center denied">
    <div class="denied__icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" focusable="false">
        <path d="M12 3l7.5 3.2v5.4c0 4.5-3 8.4-7.5 9.9-4.5-1.5-7.5-5.4-7.5-9.9V6.2L12 3z"></path>
        <rect x="9" y="11" width="6" height="5" rx="1.5"></rect>
        <path d="M10.5 11V9.8a1.5 1.5 0 0 1 3 0V11"></path>
      </svg>
    </div>

    <h1 class="denied__title">需要登录后才能访问</h1>
    <p class="denied__desc">该页面受 SSO 会话保护。登录后即可自动返回此页面继续访问。</p>

    <div class="denied__actions">
      <a class="btn btn--primary btn--lg" href="login.html?redirect=app.html" data-el="denied-login-link">
        <span class="btn__label">前往登录</span>
      </a>
      <a class="btn btn--ghost btn--lg" href="index.html">
        <span class="btn__label">返回首页</span>
      </a>
    </div>

    <p class="denied__hint">演示环境不会真正阻止访问，仅用于展示流程。</p>
  </section>
</main>

<script src="assets/auth.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
