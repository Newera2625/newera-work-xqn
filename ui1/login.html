<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · Demo SSO</title>
<meta name="description" content="Demo SSO 统一登录页：使用演示账号完成身份校验并建立会话。">
<link rel="stylesheet" href="assets/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%233B5BDB' stroke-width='1.75' stroke-linecap='round' stroke-linejoin='round'%3E%3Ccircle cx='7.5' cy='12' r='3.5'/%3E%3Ccircle cx='16.5' cy='12' r='3.5'/%3E%3Cpath d='M11 12h2'/%3E%3C/svg%3E">
</head>
<body>

<main class="auth-main">
  <section class="card card--center">

    <!-- 品牌区 -->
    <div class="auth-card__brand">
      <span class="auth-card__brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <circle cx="7.5" cy="12" r="3.5"></circle>
          <circle cx="16.5" cy="12" r="3.5"></circle>
          <path d="M11 12h2"></path>
        </svg>
      </span>
      <h1 class="auth-card__title">登录 Demo SSO</h1>
      <p class="auth-card__subtitle">使用演示账号继续</p>
    </div>

    <!-- 状态提示条（redirect / expired / logout） -->
    <div class="alert alert--info" data-el="login-notice" role="status" aria-live="polite" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <circle cx="12" cy="12" r="9"></circle>
        <path d="M12 11v5M12 8h.01"></path>
      </svg>
      <span class="alert__text">
        <span data-el="login-notice-text">提示信息</span>
        <span class="alert__target" data-el="redirect-target" hidden></span>
      </span>
    </div>

    <!-- 登录表单 -->
    <form data-el="login-form" novalidate>
      <div class="field">
        <label class="field__label" for="email">邮箱</label>
        <span class="input-wrap">
          <svg class="input-wrap__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <rect x="3" y="5" width="18" height="14" rx="2"></rect>
            <path d="M3.5 6.5l8.5 6 8.5-6"></path>
          </svg>
          <input class="input" id="email" name="email" type="email" inputmode="email"
                 data-el="field-email" placeholder="you@demo.com" autocomplete="username"
                 spellcheck="false" aria-describedby="email-help">
        </span>
        <span class="field__help" id="email-help">演示账号格式为 xxx@demo.com</span>
      </div>

      <div class="field">
        <label class="field__label" for="password">密码</label>
        <span class="input-wrap">
          <svg class="input-wrap__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <rect x="4" y="10" width="16" height="10" rx="2"></rect>
            <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
          </svg>
          <input class="input input--has-toggle" id="password" name="password" type="password"
                 data-el="field-password" placeholder="请输入密码" autocomplete="current-password"
                 aria-describedby="password-help">
          <button class="input-toggle" type="button" data-el="toggle-password"
                  aria-label="显示密码" aria-pressed="false" title="显示密码">
            <svg data-el="toggle-password-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
              <path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </span>
        <span class="field__help" id="password-help">三个演示账号的密码均为 demo123</span>
      </div>

      <div class="field field--row">
        <label class="checkbox" for="remember">
          <input type="checkbox" id="remember" data-el="remember-me">
          <span>记住此设备（30 天）</span>
        </label>
      </div>

      <!-- 错误提示条 -->
      <div class="alert alert--error" data-el="login-error" role="alert" aria-live="polite" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <circle cx="12" cy="12" r="9"></circle>
          <path d="M12 7.5v5M12 16h.01"></path>
        </svg>
        <span class="alert__text" data-el="login-error-text">账号或密码不正确，请重试</span>
      </div>

      <button class="btn btn--primary btn--lg btn--block" type="submit" data-el="submit-login" aria-busy="false">
        <svg class="btn__spinner" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true" focusable="false">
          <circle cx="12" cy="12" r="9" opacity="0.25"></circle>
          <path d="M21 12a9 9 0 0 0-9-9"></path>
        </svg>
        <span class="btn__label" data-el="submit-label">登录</span>
      </button>
    </form>

    <div class="divider">或使用已有身份登录</div>

    <a class="btn btn--secondary btn--md btn--block" href="accounts.html">
      <span class="btn__label">选择已有身份</span>
    </a>

    <div class="demo-hint">
      演示环境可用账号：<code>admin@demo.com</code> / <code>user@demo.com</code> / <code>guest@demo.com</code>，密码 <code>demo123</code>
    </div>

    <p class="card__footer">
      <a href="index.html">返回首页</a>
    </p>
  </section>
</main>

<script src="assets/auth.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
