<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo SSO · 单点登录演示</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<main class="container page">
  <h1 class="page__title">Demo SSO</h1>
  <p class="page__desc">视觉稿占位页，用于校验样式令牌与响应式表现。</p>
  <section class="section">
    <h2 class="section__title">按钮状态</h2>
    <div style="display:flex; flex-wrap:wrap; gap:var(--space-3);">
      <button class="btn btn--primary btn--md" type="button"><span class="btn__label">主按钮</span></button>
      <button class="btn btn--secondary btn--md" type="button"><span class="btn__label">次按钮</span></button>
      <button class="btn btn--ghost btn--md" type="button"><span class="btn__label">文字按钮</span></button>
      <button class="btn btn--quiet btn--md" type="button"><span class="btn__label">安静按钮</span></button>
      <button class="btn btn--primary btn--md" type="button" disabled><span class="btn__label">禁用</span></button>
    </div>
  </section>
</main>
</body>
</html>
